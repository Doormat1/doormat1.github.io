<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Paper Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .control-panel {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 300px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .control-panel h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 1.5em;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .control-group input[type="number"],
        .control-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .control-group input[type="color"] {
            width: 100%;
            padding: 5px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            height: 45px;
            cursor: pointer;
        }

        .control-group input[type="number"]:focus,
        .control-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            flex: 1;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-download {
            background: #28a745;
            color: white;
        }

        .btn-download:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }

        .canvas-container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
        }

        canvas {
            display: block;
            border: 1px solid #e9ecef;
            background: white;
        }

        .info-text {
            color: #999;
            font-size: 0.85em;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
        }

        @media (max-width: 1200px) {
            body {
                flex-direction: column;
            }

            .control-panel {
                width: 100%;
                position: static;
            }

            .canvas-container {
                min-height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="control-panel">
        <h2>📊 Graph Paper</h2>

        <div class="control-group">
            <label for="bigSquaresX">Big Squares (X-axis):</label>
            <input type="number" id="bigSquaresX" value="10" min="1" max="50">
        </div>

        <div class="control-group">
            <label for="bigSquaresY">Big Squares (Y-axis):</label>
            <input type="number" id="bigSquaresY" value="10" min="1" max="50">
        </div>

        <div class="control-group">
            <label for="gridWidth">Grid Width (cm):</label>
            <input type="number" id="gridWidth" value="15" min="1" max="20" step="0.5">
        </div>

        <div class="control-group">
            <label for="gridHeight">Grid Height (cm):</label>
            <input type="number" id="gridHeight" value="15" min="1" max="28" step="0.5">
        </div>

        <div class="control-group">
            <label for="smallSquaresPerBig">Small Squares per Big Square:</label>
            <input type="number" id="smallSquaresPerBig" value="10" min="1" max="20">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="showAxisLabels" checked>
            <label for="showAxisLabels">Show Axis Labels</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="showGridLines" checked>
            <label for="showGridLines">Show Small Grid Lines</label>
        </div>

        <div class="control-group">
            <label for="smallGridColor">Small Grid Color:</label>
            <input type="color" id="smallGridColor" value="#c0c0c0">
        </div>

        <div class="control-group">
            <label for="bigGridColor">Big Grid Color:</label>
            <input type="color" id="bigGridColor" value="#333333">
        </div>

        <div class="control-group" id="xLabelGroup" style="display: none;">
            <label for="xAxisLabel">X-Axis Label:</label>
            <input type="text" id="xAxisLabel" value="x">
        </div>

        <div class="control-group" id="yLabelGroup" style="display: none;">
            <label for="yAxisLabel">Y-Axis Label:</label>
            <input type="text" id="yAxisLabel" value="y">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="useCustomAxisValues">
            <label for="useCustomAxisValues">Custom Axis Values</label>
        </div>

        <div class="control-group" id="xStartGroup" style="display: none;">
            <label for="xStartValue">X-Axis Start Value:</label>
            <input type="number" id="xStartValue" value="0" step="0.1">
        </div>

        <div class="control-group" id="xIncrementGroup" style="display: none;">
            <label for="xIncrement">X-Axis Increment:</label>
            <input type="number" id="xIncrement" value="1" step="0.1" min="0.01">
        </div>

        <div class="control-group" id="yStartGroup" style="display: none;">
            <label for="yStartValue">Y-Axis Start Value:</label>
            <input type="number" id="yStartValue" value="0" step="0.1">
        </div>

        <div class="control-group" id="yIncrementGroup" style="display: none;">
            <label for="yIncrement">Y-Axis Increment:</label>
            <input type="number" id="yIncrement" value="1" step="0.1" min="0.01">
        </div>

        <div id="warningBox" style="display: none; background: #fff3cd; border: 2px solid #ffc107; border-radius: 6px; padding: 12px; margin-top: 15px; color: #856404; font-size: 0.9em; line-height: 1.4;">
            <strong>⚠️ Warning:</strong> <span id="warningText"></span>
        </div>

        <div class="button-group">
            <button class="btn-generate" onclick="generateGraphPaper()">Generate</button>
        </div>

        <div class="button-group">
            <button class="btn-download" onclick="downloadGraphSVG()">Download SVG</button>
            <button class="btn-download" onclick="downloadGraphPDF()">Download PDF</button>
        </div>

        <div class="info-text">
            💡 Tip: Set the grid dimensions in centimeters to fit on A4 paper. Download as SVG for editing in design software or PDF for printing.
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="graphCanvas"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const showAxisLabelsCheckbox = document.getElementById('showAxisLabels');
        const useCustomAxisValuesCheckbox = document.getElementById('useCustomAxisValues');
        const xLabelGroup = document.getElementById('xLabelGroup');
        const yLabelGroup = document.getElementById('yLabelGroup');
        const xStartGroup = document.getElementById('xStartGroup');
        const xIncrementGroup = document.getElementById('xIncrementGroup');
        const yStartGroup = document.getElementById('yStartGroup');
        const yIncrementGroup = document.getElementById('yIncrementGroup');
        const warningBox = document.getElementById('warningBox');
        const warningText = document.getElementById('warningText');

        // Store current graph parameters for SVG/PDF export
        let currentGraphParams = {};

        // Show/hide label inputs based on checkbox
        showAxisLabelsCheckbox.addEventListener('change', function() {
            xLabelGroup.style.display = this.checked ? 'block' : 'none';
            yLabelGroup.style.display = this.checked ? 'block' : 'none';
        });

        // Show/hide custom axis value inputs based on checkbox
        useCustomAxisValuesCheckbox.addEventListener('change', function() {
            xStartGroup.style.display = this.checked ? 'block' : 'none';
            xIncrementGroup.style.display = this.checked ? 'block' : 'none';
            yStartGroup.style.display = this.checked ? 'block' : 'none';
            yIncrementGroup.style.display = this.checked ? 'block' : 'none';
        });

        // Initialize
        xLabelGroup.style.display = showAxisLabelsCheckbox.checked ? 'block' : 'none';
        yLabelGroup.style.display = showAxisLabelsCheckbox.checked ? 'block' : 'none';

        function generateGraphPaper() {
            const bigSquaresX = parseInt(document.getElementById('bigSquaresX').value) || 10;
            const bigSquaresY = parseInt(document.getElementById('bigSquaresY').value) || 10;
            const smallSquaresPerBig = parseInt(document.getElementById('smallSquaresPerBig').value) || 10;
            let gridWidthCm = parseFloat(document.getElementById('gridWidth').value) || 15;
            let gridHeightCm = parseFloat(document.getElementById('gridHeight').value) || 15;
            const showAxisLabels = document.getElementById('showAxisLabels').checked;
            const showGridLines = document.getElementById('showGridLines').checked;
            const xAxisLabel = document.getElementById('xAxisLabel').value || 'x';
            const yAxisLabel = document.getElementById('yAxisLabel').value || 'y';
            const smallGridColor = document.getElementById('smallGridColor').value;
            const bigGridColor = document.getElementById('bigGridColor').value;
            const useCustomAxisValues = document.getElementById('useCustomAxisValues').checked;
            const xStartValue = parseFloat(document.getElementById('xStartValue').value) || 0;
            const xIncrement = parseFloat(document.getElementById('xIncrement').value) || 1;
            const yStartValue = parseFloat(document.getElementById('yStartValue').value) || 0;
            const yIncrement = parseFloat(document.getElementById('yIncrement').value) || 1;

            // Check if grid lines are too close together
            const DPI = 96;
            const CM_TO_PIXELS = DPI / 2.54;
            const MIN_PIXELS_BETWEEN_LINES = 30; // Minimum pixels between major grid lines for readability
            
            const gridWidthPx = gridWidthCm * CM_TO_PIXELS;
            const gridHeightPx = gridHeightCm * CM_TO_PIXELS;
            
            const pixelsPerSquareX = gridWidthPx / bigSquaresX;
            const pixelsPerSquareY = gridHeightPx / bigSquaresY;
            
            // Warning logic
            warningBox.style.display = 'none';
            let warnings = [];
            
            if (pixelsPerSquareX < MIN_PIXELS_BETWEEN_LINES) {
                const newWidth = (bigSquaresX * MIN_PIXELS_BETWEEN_LINES) / CM_TO_PIXELS;
                warnings.push(`Width was too small (${pixelsPerSquareX.toFixed(1)}px per square). Auto-adjusted from ${gridWidthCm}cm to ${newWidth.toFixed(1)}cm.`);
                gridWidthCm = newWidth;
                document.getElementById('gridWidth').value = newWidth.toFixed(1);
            }
            
            if (pixelsPerSquareY < MIN_PIXELS_BETWEEN_LINES) {
                const newHeight = (bigSquaresY * MIN_PIXELS_BETWEEN_LINES) / CM_TO_PIXELS;
                warnings.push(`Height was too small (${pixelsPerSquareY.toFixed(1)}px per square). Auto-adjusted from ${gridHeightCm}cm to ${newHeight.toFixed(1)}cm.`);
                gridHeightCm = newHeight;
                document.getElementById('gridHeight').value = newHeight.toFixed(1);
            }
            
            if (warnings.length > 0) {
                warningBox.style.display = 'block';
                warningText.textContent = warnings.join(' ');
            }

            // Store parameters for export
            currentGraphParams = {
                bigSquaresX, bigSquaresY, smallSquaresPerBig,
                gridWidthCm, gridHeightCm,
                showAxisLabels, showGridLines,
                xAxisLabel, yAxisLabel,
                smallGridColor, bigGridColor,
                useCustomAxisValues, xStartValue, xIncrement, yStartValue, yIncrement
            };
            
            // Calculate square size based on grid dimensions
            const squareSize = gridWidthPx / bigSquaresX;
            const squareSizeY = gridHeightPx / bigSquaresY;
            // Use the smaller value to ensure it fits
            const actualSquareSize = Math.min(squareSize, squareSizeY);
            
            const smallSquareSize = actualSquareSize / smallSquaresPerBig;
            const padding = 60;
            const width = actualSquareSize * bigSquaresX + padding * 2;
            const height = actualSquareSize * bigSquaresY + padding * 2;

            canvas.width = width;
            canvas.height = height;

            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, width, height);

            // Draw small grid lines if enabled
            if (showGridLines) {
                ctx.strokeStyle = smallGridColor;
                ctx.lineWidth = 0.75;
                
                // Vertical lines
                for (let i = 0; i <= bigSquaresX * smallSquaresPerBig; i++) {
                    const x = padding + i * smallSquareSize;
                    ctx.beginPath();
                    ctx.moveTo(x, padding);
                    ctx.lineTo(x, padding + bigSquaresY * actualSquareSize);
                    ctx.stroke();
                }
                
                // Horizontal lines
                for (let i = 0; i <= bigSquaresY * smallSquaresPerBig; i++) {
                    const y = padding + i * smallSquareSize;
                    ctx.beginPath();
                    ctx.moveTo(padding, y);
                    ctx.lineTo(padding + bigSquaresX * actualSquareSize, y);
                    ctx.stroke();
                }
            }

            // Draw big grid lines
            ctx.strokeStyle = bigGridColor;
            ctx.lineWidth = 2;
            
            // Vertical lines for big squares
            for (let i = 0; i <= bigSquaresX; i++) {
                const x = padding + i * actualSquareSize;
                ctx.beginPath();
                ctx.moveTo(x, padding);
                ctx.lineTo(x, padding + bigSquaresY * actualSquareSize);
                ctx.stroke();
            }
            
            // Horizontal lines for big squares
            for (let i = 0; i <= bigSquaresY; i++) {
                const y = padding + i * actualSquareSize;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(padding + bigSquaresX * actualSquareSize, y);
                ctx.stroke();
            }

            // Draw outer border (only on left and bottom as axes)
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            const gridLeft = padding;
            const gridTop = padding;
            const gridRight = padding + bigSquaresX * actualSquareSize;
            const gridBottom = padding + bigSquaresY * actualSquareSize;
            
            // Draw only left and bottom borders (the axes)
            ctx.beginPath();
            ctx.moveTo(gridLeft, gridTop);
            ctx.lineTo(gridLeft, gridBottom);
            ctx.lineTo(gridRight, gridBottom);
            ctx.stroke();
            
            // Draw right and top borders with thin line
            ctx.strokeStyle = bigGridColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(gridRight, gridTop);
            ctx.lineTo(gridRight, gridBottom);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(gridLeft, gridTop);
            ctx.lineTo(gridRight, gridTop);
            ctx.stroke();

            // Draw arrows on axes
            const arrowSize = 12;
            const arrowColor = '#000';
            
            // Right arrow at end of X-axis (bottom edge, at right)
            const rightArrowStartX = gridRight - arrowSize;
            const rightArrowEndX = gridRight + 5;
            const rightArrowY = gridBottom;
            drawArrow(ctx, rightArrowStartX, rightArrowY, rightArrowEndX, rightArrowY, arrowSize, arrowColor);
            
            // Up arrow at end of Y-axis (left edge, at top)
            const upArrowX = gridLeft;
            const upArrowStartY = gridTop + arrowSize;
            const upArrowEndY = gridTop - 5;
            drawArrow(ctx, upArrowX, upArrowStartY, upArrowX, upArrowEndY, arrowSize, arrowColor);

            // Draw axis labels if enabled
            if (showAxisLabels) {
                ctx.fillStyle = '#000';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';

                // X-axis labels
                for (let i = 0; i <= bigSquaresX; i++) {
                    const x = gridLeft + i * actualSquareSize;
                    let labelText;
                    if (useCustomAxisValues) {
                        labelText = (xStartValue + i * xIncrement).toString();
                    } else {
                        labelText = i.toString();
                    }
                    ctx.fillText(labelText, x, gridBottom + 8);
                }

                // Y-axis labels
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                for (let i = 0; i <= bigSquaresY; i++) {
                    const y = gridBottom - i * actualSquareSize;
                    let labelText;
                    if (useCustomAxisValues) {
                        labelText = (yStartValue + i * yIncrement).toString();
                    } else {
                        labelText = i.toString();
                    }
                    ctx.fillText(labelText, gridLeft - 10, y);
                }

                // Axis label text
                ctx.font = 'italic 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(xAxisLabel, gridLeft + (bigSquaresX * actualSquareSize) / 2, height - 10);
                
                ctx.save();
                ctx.translate(12, gridTop + (bigSquaresY * actualSquareSize) / 2);
                ctx.rotate(-Math.PI / 2);
                ctx.fillText(yAxisLabel, 0, 0);
                ctx.restore();
            }
        }

        function drawArrow(ctx, fromX, fromY, toX, toY, size, color) {
            const angle = Math.atan2(toY - fromY, toX - fromX);
            
            // Draw line
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();
            
            // Draw arrowhead
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - size * Math.cos(angle - Math.PI / 6), toY - size * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - size * Math.cos(angle + Math.PI / 6), toY - size * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }

        function downloadGraph() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'graph-paper.png';
            link.click();
        }

        function generateSVG() {
            const p = currentGraphParams;
            const DPI = 96;
            const CM_TO_PIXELS = DPI / 2.54;
            
            const gridWidthPx = p.gridWidthCm * CM_TO_PIXELS;
            const gridHeightPx = p.gridHeightCm * CM_TO_PIXELS;
            
            const squareSize = gridWidthPx / p.bigSquaresX;
            const squareSizeY = gridHeightPx / p.bigSquaresY;
            const actualSquareSize = Math.min(squareSize, squareSizeY);
            
            const smallSquareSize = actualSquareSize / p.smallSquaresPerBig;
            const padding = 60;
            const width = actualSquareSize * p.bigSquaresX + padding * 2;
            const height = actualSquareSize * p.bigSquaresY + padding * 2;

            let svg = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            svg += `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">\n`;
            svg += `<rect width="${width}" height="${height}" fill="white"/>\n`;

            const gridLeft = padding;
            const gridTop = padding;
            const gridRight = padding + p.bigSquaresX * actualSquareSize;
            const gridBottom = padding + p.bigSquaresY * actualSquareSize;

            // Small grid lines
            if (p.showGridLines) {
                for (let i = 0; i <= p.bigSquaresX * p.smallSquaresPerBig; i++) {
                    const x = padding + i * smallSquareSize;
                    svg += `<line x1="${x}" y1="${gridTop}" x2="${x}" y2="${gridBottom}" stroke="${p.smallGridColor}" stroke-width="0.75"/>\n`;
                }
                for (let i = 0; i <= p.bigSquaresY * p.smallSquaresPerBig; i++) {
                    const y = padding + i * smallSquareSize;
                    svg += `<line x1="${gridLeft}" y1="${y}" x2="${gridRight}" y2="${y}" stroke="${p.smallGridColor}" stroke-width="0.75"/>\n`;
                }
            }

            // Big grid lines
            for (let i = 0; i <= p.bigSquaresX; i++) {
                const x = padding + i * actualSquareSize;
                svg += `<line x1="${x}" y1="${gridTop}" x2="${x}" y2="${gridBottom}" stroke="${p.bigGridColor}" stroke-width="2"/>\n`;
            }
            for (let i = 0; i <= p.bigSquaresY; i++) {
                const y = padding + i * actualSquareSize;
                svg += `<line x1="${gridLeft}" y1="${y}" x2="${gridRight}" y2="${y}" stroke="${p.bigGridColor}" stroke-width="2"/>\n`;
            }

            // Outer border (only on left and bottom as axes)
            svg += `<line x1="${gridLeft}" y1="${gridTop}" x2="${gridLeft}" y2="${gridBottom}" stroke="black" stroke-width="3"/>\n`;
            svg += `<line x1="${gridLeft}" y1="${gridBottom}" x2="${gridRight}" y2="${gridBottom}" stroke="black" stroke-width="3"/>\n`;
            
            // Right and top borders with thin line
            svg += `<line x1="${gridRight}" y1="${gridTop}" x2="${gridRight}" y2="${gridBottom}" stroke="${p.bigGridColor}" stroke-width="2"/>\n`;
            svg += `<line x1="${gridLeft}" y1="${gridTop}" x2="${gridRight}" y2="${gridTop}" stroke="${p.bigGridColor}" stroke-width="2"/>\n`;

            // Arrows on axes
            const arrowSize = 12;
            const rightArrowEndX = gridRight + 5;
            const rightArrowStartX = gridRight - arrowSize;
            const rightArrowY = gridBottom;
            svg += `<line x1="${rightArrowStartX}" y1="${rightArrowY}" x2="${rightArrowEndX}" y2="${rightArrowY}" stroke="black" stroke-width="2"/>\n`;
            svg += `<polygon points="${rightArrowEndX},${rightArrowY} ${rightArrowEndX - 8},${rightArrowY - 5} ${rightArrowEndX - 8},${rightArrowY + 5}" fill="black"/>\n`;

            const upArrowX = gridLeft;
            const upArrowEndY = gridTop - 5;
            const upArrowStartY = gridTop + arrowSize;
            svg += `<line x1="${upArrowX}" y1="${upArrowStartY}" x2="${upArrowX}" y2="${upArrowEndY}" stroke="black" stroke-width="2"/>\n`;
            svg += `<polygon points="${upArrowX},${upArrowEndY} ${upArrowX - 5},${upArrowEndY + 8} ${upArrowX + 5},${upArrowEndY + 8}" fill="black"/>\n`;

            // Axis labels
            if (p.showAxisLabels) {
                for (let i = 0; i <= p.bigSquaresX; i++) {
                    const x = gridLeft + i * actualSquareSize;
                    let labelText;
                    if (p.useCustomAxisValues) {
                        labelText = (p.xStartValue + i * p.xIncrement).toString();
                    } else {
                        labelText = i.toString();
                    }
                    svg += `<text x="${x}" y="${gridBottom + 15}" text-anchor="middle" font-size="14" font-weight="bold">${labelText}</text>\n`;
                }
                for (let i = 0; i <= p.bigSquaresY; i++) {
                    const y = gridBottom - i * actualSquareSize;
                    let labelText;
                    if (p.useCustomAxisValues) {
                        labelText = (p.yStartValue + i * p.yIncrement).toString();
                    } else {
                        labelText = i.toString();
                    }
                    svg += `<text x="${gridLeft - 15}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="14" font-weight="bold">${labelText}</text>\n`;
                }
                svg += `<text x="${gridLeft + (p.bigSquaresX * actualSquareSize) / 2}" y="${height - 10}" text-anchor="middle" font-size="12" font-style="italic">${p.xAxisLabel}</text>\n`;
                svg += `<text x="20" y="${gridTop + (p.bigSquaresY * actualSquareSize) / 2}" text-anchor="middle" font-size="12" font-style="italic" transform="rotate(-90 20 ${gridTop + (p.bigSquaresY * actualSquareSize) / 2})">${p.yAxisLabel}</text>\n`;
            }

            svg += `</svg>`;
            return svg;
        }

        function downloadGraphSVG() {
            const svg = generateSVG();
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'graph-paper.svg';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function downloadGraphPDF() {
            const svg = generateSVG();
            const element = document.createElement('div');
            element.innerHTML = svg;
            
            const opt = {
                margin: 0,
                filename: 'graph-paper.pdf',
                image: { type: 'svg' },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'px', format: [canvas.width, canvas.height], orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(element).save();
        }

        // Generate on load
        generateGraphPaper();
    </script>
</body>
</html>
